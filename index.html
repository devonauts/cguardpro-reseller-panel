<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- SIN MARCA A PROPÓSITO. Este título y este icono los sustituye la marca
         del socio en cuanto carga la aplicación. Meter aquí «CGuard Pro»
         obligaría a acordarse de quitarlo, y el día que se olvide se lo
         encuentra un socio en su propia pantalla de entrada.

         En INGLÉS, igual que el defecto del panel: esto es lo que se ve en la
         pestaña durante el instante anterior a que arranque el JavaScript, y
         si aquí pusiera castellano ese instante contradiría al resto. `lang`
         lo reescribe el idioma elegido en cuanto hay aplicación. -->
    <title>Partner panel</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- TRAMPA PARA CLONADORES (plan anti-copia, fase 3). Invisible, fuera del
         orden de tabulación y oculto a lectores de pantalla: ninguna persona
         llega a él, y `nofollow` aparta a los buscadores serios. Quien lo sigue
         es una herramienta que copia la web entera (HTTrack, wget -m…), y
         queda anotada en /api/v1/respaldo-completo (señal `honeypot`). -->
    <a href="/api/v1/respaldo-completo" rel="nofollow" tabindex="-1" aria-hidden="true" style="display:none">respaldo</a>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
